# /etc/nginx/sites-available/naqsha-zameen  (symlink into sites-enabled, then: nginx -t && systemctl reload nginx)
# TLS via: certbot --nginx -d dashboard.naqsha-zameen.pk -d api.naqsha-zameen.pk
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream naqsha_app { server 127.0.0.1:5000; keepalive 32; }

server {
    listen 80;
    server_name dashboard.naqsha-zameen.pk api.naqsha-zameen.pk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.naqsha-zameen.pk api.naqsha-zameen.pk;
    # ssl_certificate / ssl_certificate_key are filled in by certbot

    client_max_body_size 8m;          # payment-proof uploads (4 MB JSON + overhead)
    proxy_read_timeout 150s;          # operations report generation (120 s client timeout)

    location /socket.io/ {
        proxy_pass http://naqsha_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Range requests must pass through untouched
    location /pmtiles/ {
        gzip off;
        proxy_pass http://naqsha_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://naqsha_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
