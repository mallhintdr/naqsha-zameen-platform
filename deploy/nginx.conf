# /etc/nginx/sites-available/naqsha-zameen
# Website + dashboard on naqsha-zameen.com, served from this VPS.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/naqsha-zameen
#   sudo ln -sf /etc/nginx/sites-available/naqsha-zameen /etc/nginx/sites-enabled/naqsha-zameen
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d naqsha-zameen.com -d www.naqsha-zameen.com -d dashboard.naqsha-zameen.com
# Certbot adds the HTTPS (443) parts and http->https redirects to the blocks below.
#
# Leave the existing api.naqsha-zameen.pk site file enabled while customers still use .pk.
# See docs/DOMAIN-MIGRATION.md.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---------------------------------------------------------------------------
# Dashboard app (Node, pm2).
#   Parallel testing: port 5001 (pm2 "geo-dashboard-test", JOBS_ENABLED=false)
#   After cutover:    change to 5000 (pm2 "geo-dashboard")
# ---------------------------------------------------------------------------
upstream naqsha_dashboard {
    server 127.0.0.1:5001;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Website: https://naqsha-zameen.com (static files built from site/)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name naqsha-zameen.com;

    root /var/www/naqsha-zameen-site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Old links from the .pk site to dashboard pages + merged /dashboard/ marketing page
    location = /register { return 301 https://dashboard.naqsha-zameen.com/register$is_args$args; }
    location = /login    { return 301 https://dashboard.naqsha-zameen.com/login$is_args$args; }
    location ~ ^/dashboard/?$ { return 301 https://naqsha-zameen.com/maps/$is_args$args; }

    # Hashed build assets never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Pages: the browser checks for a newer copy every time (scripts and styles are hashed above).
    location / {
        add_header Cache-Control "no-cache" always;
        # (an add_header here replaces the server-level ones, so they are repeated)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}

# www -> bare domain (one canonical address)
server {
    listen 80;
    listen [::]:80;
    server_name www.naqsha-zameen.com;
    return 301 https://naqsha-zameen.com$request_uri;
}

# ---------------------------------------------------------------------------
# Dashboard: https://dashboard.naqsha-zameen.com (app + API on one origin)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.naqsha-zameen.com;

    client_max_body_size 8m;   # payment-proof uploads (4 MB JSON + overhead)
    proxy_read_timeout 150s;   # operations report generation (120 s client timeout)

    location /socket.io/ {
        proxy_pass http://naqsha_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Map tiles: Range requests must pass through untouched
    location /pmtiles/ {
        gzip off;
        proxy_pass http://naqsha_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://naqsha_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

